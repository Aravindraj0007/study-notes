<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrackIt</title>
<script>(function(){try{var t=JSON.parse(localStorage.getItem('trackit:theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  :root{
    --bg:#f6f7f8; --surface:#ffffff; --surface2:#fbfbfc; --ink:#181a1d; --muted:#6a6e77; --faint:#9aa0aa;
    --line:#e7e8ec; --line2:#eef0f3; --accent:#5b57d6; --accent-soft:#ecebfb; --done:#12a150; --done-soft:#e6f6ec;
    --shadow:0 1px 2px rgba(20,22,30,.05),0 1px 1px rgba(20,22,30,.04);
    --mono:ui-monospace,"JetBrains Mono","Cascadia Code","SF Mono","Roboto Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme:dark){ :root{
    --bg:#0d0e12; --surface:#16181d; --surface2:#1b1e24; --ink:#e8e9ec; --muted:#969ba5; --faint:#666b76;
    --line:#262a31; --line2:#20242b; --accent:#8b88f2; --accent-soft:#232244; --done:#42d089; --done-soft:#16281f;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }}
  :root[data-theme="light"]{
    --bg:#f6f7f8; --surface:#ffffff; --surface2:#fbfbfc; --ink:#181a1d; --muted:#6a6e77; --faint:#9aa0aa;
    --line:#e7e8ec; --line2:#eef0f3; --accent:#5b57d6; --accent-soft:#ecebfb; --done:#12a150; --done-soft:#e6f6ec;
    --shadow:0 1px 2px rgba(20,22,30,.05),0 1px 1px rgba(20,22,30,.04);
  }
  :root[data-theme="dark"]{
    --bg:#0d0e12; --surface:#16181d; --surface2:#1b1e24; --ink:#e8e9ec; --muted:#969ba5; --faint:#666b76;
    --line:#262a31; --line2:#20242b; --accent:#8b88f2; --accent-soft:#232244; --done:#42d089; --done-soft:#16281f;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--mono); background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
       -webkit-font-smoothing:antialiased; letter-spacing:-.005em}
  .app{max-width:960px; margin:0 auto; padding:0 18px 80px}
  a{color:inherit}

  /* header */
  header.hd{position:sticky; top:0; z-index:30; background:color-mix(in srgb,var(--bg) 90%,transparent);
            -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
            padding:16px 0 0; border-bottom:1px solid var(--line)}
  .row1{display:flex; align-items:center; gap:14px}
  .brand{font-size:20px; font-weight:700; letter-spacing:-.02em}
  .brand .sub{color:var(--faint); font-weight:500; font-size:12.5px; margin-left:8px}
  .spacer{flex:1}
  .iconbtn{display:inline-flex; align-items:center; justify-content:center; gap:7px; cursor:pointer;
    font-family:var(--mono); font-size:12px; color:var(--muted); background:var(--surface); border:1px solid var(--line);
    border-radius:9px; padding:7px 11px; transition:border-color .15s,color .15s,background .15s}
  .iconbtn:hover{color:var(--ink); border-color:var(--faint)}
  .iconbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .iconbtn svg{width:15px; height:15px}

  /* overall progress */
  .prog{display:flex; flex-direction:column; gap:14px; padding:16px 0 14px}
  .ptop{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:7px}
  .pname{display:flex; align-items:center; gap:8px; min-width:0; font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .pdot{flex:0 0 auto; width:8px; height:8px; border-radius:50%; background:var(--accent)}
  .pstat{flex:0 0 auto; display:flex; align-items:baseline; gap:10px; font-size:12.5px; font-variant-numeric:tabular-nums; white-space:nowrap}
  .pstat .pp{font-weight:700; color:var(--ink)}
  .pstat .pp.pa{color:var(--accent)}
  .pstat .pc{color:var(--muted)}
  .pstat .pc b{color:var(--ink)}
  .pbar{height:8px; background:var(--line); border-radius:99px; overflow:hidden}
  .pbar>i{display:block; height:100%; width:0; border-radius:99px; background:var(--accent); transition:width .45s cubic-bezier(.4,0,.2,1)}

  /* tabs */
  nav.tabs{display:flex; gap:3px; overflow-x:auto; padding:2px 0 0; scrollbar-width:thin}
  .tab{flex:0 0 auto; display:inline-flex; align-items:center; gap:8px; cursor:pointer; border:0; background:transparent;
       font-family:var(--mono); font-size:12.5px; color:var(--muted); padding:9px 12px 13px; border-bottom:2px solid transparent;
       white-space:nowrap}
  .tab .dot{width:8px;height:8px;border-radius:50%;background:var(--sc,#888)}
  .tab .n{font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--sc,var(--accent)); font-weight:650}
  .tab:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; border-radius:6px}

  /* toolbar */
  .toolbar{display:flex; align-items:center; gap:10px; padding:16px 0 6px; flex-wrap:wrap}
  .search{position:relative; flex:1 1 260px}
  .search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--faint); width:15px;height:15px}
  .search input{width:100%; font-family:var(--mono); font-size:13px; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:9px; padding:9px 12px 9px 34px}
  .search input::placeholder{color:var(--faint)}
  .search input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .tbtn{cursor:pointer; font-family:var(--mono); font-size:12px; color:var(--muted); background:transparent;
        border:1px solid var(--line); border-radius:8px; padding:8px 10px; transition:.15s}
  .tbtn:hover{color:var(--ink); border-color:var(--faint)}
  .tbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* accordions */
  main{padding-top:8px}
  .acc{background:var(--surface); border:1px solid var(--line); border-radius:12px; margin:10px 0; box-shadow:var(--shadow);
       overflow:hidden}
  .acc-h{display:flex; align-items:center; gap:12px; width:100%; cursor:pointer; border:0; background:transparent;
         font-family:var(--mono); text-align:left; padding:14px 15px; color:var(--ink)}
  .acc-h:hover{background:var(--surface2)}
  .acc-h:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
  .chev{width:16px;height:16px;color:var(--faint); flex:0 0 auto; transition:transform .22s ease}
  .acc.open .chev,.acc.fopen .chev{transform:rotate(90deg)}
  .acc-h .pn{font-size:11px;color:var(--sc,var(--accent));font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .acc-h .pt{font-size:14px;font-weight:650;letter-spacing:-.01em;flex:1 1 auto}
  .acc-h .pbadge{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;
                 background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
  .acc-h .pbadge.full{color:var(--done);border-color:var(--done);background:var(--done-soft)}
  .pmark{flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; border:0; background:transparent; color:var(--faint); padding:4px; margin:-3px -3px -3px 1px; border-radius:8px; transition:color .15s,background .15s}
  .pmark:hover{color:var(--done); background:var(--surface2)}
  .pmark:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .pmark svg{width:21px; height:21px; display:block}
  .pmark svg .tick{opacity:0; transition:opacity .15s}
  .pmark:hover svg .tick{opacity:.55}
  .pmark.partial{color:var(--accent)}
  .pmark.full{color:var(--done)}
  .pmark.full svg circle{fill:var(--done); stroke:var(--done)}
  .pmark.full svg .tick{opacity:1; stroke:#fff}
  .acc-body{display:grid; grid-template-rows:0fr; transition:grid-template-rows .24s ease}
  .acc.open .acc-body,.acc.fopen .acc-body{grid-template-rows:1fr}
  .acc-inner{overflow:hidden; min-height:0}
  .acc-pad{padding:2px 6px 10px}

  .stage{padding:8px 8px 2px}
  .stage-h{display:flex; align-items:center; gap:9px; font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); font-weight:600; padding:8px 6px 6px}
  .stage-h .sn{flex:1 1 auto; min-width:0}
  .sbadge{flex:0 0 auto; font-size:10px; letter-spacing:0; text-transform:none; color:var(--muted); font-variant-numeric:tabular-nums; background:var(--surface2); border:1px solid var(--line); border-radius:99px; padding:1px 7px}
  .sbadge.full{color:var(--done); border-color:var(--done); background:var(--done-soft)}
  .smark{flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; border:0; background:transparent; color:var(--faint); padding:2px; margin:-2px 0; border-radius:6px; transition:color .15s,background .15s}
  .smark:hover{color:var(--done); background:var(--surface2)}
  .smark:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .smark svg{width:17px; height:17px; display:block}
  .smark svg .tick{opacity:0; transition:opacity .15s}
  .smark:hover svg .tick{opacity:.55}
  .smark.partial{color:var(--accent)}
  .smark.full{color:var(--done)}
  .smark.full svg circle{fill:var(--done); stroke:var(--done)}
  .smark.full svg .tick{opacity:1; stroke:#fff}
  .concept{display:flex; align-items:flex-start; gap:11px; padding:6px 8px; border-radius:8px; cursor:pointer;
           transition:background .12s}
  .concept:hover{background:var(--surface2)}
  .concept input{appearance:none; -webkit-appearance:none; margin:1px 0 0; flex:0 0 auto; width:17px;height:17px;
     border:1.6px solid var(--faint); border-radius:5px; background:var(--surface); cursor:pointer; position:relative;
     transition:border-color .12s,background .12s}
  .concept input:hover{border-color:var(--accent)}
  .concept input:checked{background:var(--done); border-color:var(--done)}
  .concept input:checked::after{content:""; position:absolute; left:4.5px; top:1.5px; width:4px;height:8px;
     border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg)}
  .concept input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .concept .cx{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;min-width:20px;text-align:right;
               padding-top:1px; user-select:none}
  .concept .ct{flex:1; color:var(--ink); padding-top:1px}
  .concept .study-link{flex:1; color:var(--ink); padding:1px 0 0; border:0; background:transparent; font:inherit;
                        text-align:left; cursor:pointer; border-radius:3px}
  .concept .study-link:hover{color:var(--accent); text-decoration:underline; text-underline-offset:2px}
  .concept .study-link:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .concept.done .ct{color:var(--faint); text-decoration:line-through; text-decoration-color:var(--done)}
  .concept .ct mark{background:var(--accent-soft); color:var(--ink); border-radius:3px; padding:0 2px}
  .rhide{display:none!important}
  .empty{padding:50px 10px; text-align:center; color:var(--muted)}
  footer{color:var(--faint); font-size:11.5px; padding:26px 2px 0; display:flex; gap:14px; flex-wrap:wrap}
  footer .k{color:var(--muted)}
  @media (max-width:560px){ .brand{font-size:18px} .app{padding:0 12px 60px} .acc-h .pt{font-size:13px} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>

    <button class="tbtn" id="hidedone">hide done</button>

  <main id="main" role="tabpanel"></main>
  <footer id="foot"></footer>
</div>

27001", "The CIS Controls", "PCI DSS", "GDPR and Data Protection", "HIPAA", "SOC 2", "NIS2 and DORA", "Security Auditing", "NIST 800-53 and the Risk Management Framework", "FedRAMP", "CMMC and NIST 800-171", "Emerging Privacy Regulations (CCPA, CPRA, and the EU AI Act)"]}, {"n": "Stage 10.3 - Privacy and Data Protection", "c": ["Data Classification", "Data Loss Prevention", "Privacy by Design", "Data Retention and Disposal", "Media Sanitization and Destruction"]}]}, {"n": "Part 11 - Tools Mastery", "stages": [{"n": "Stage 11.1 - Lab Distributions and Virtualization", "c": ["Kali Linux and Parrot OS", "Using an Offensive Lab Distribution Responsibly", "VirtualBox and VMware", "Docker Basics for Security Labs"]}, {"n": "Stage 11.2 - Web Tooling", "c": ["Burp Suite", "OWASP ZAP", "Browser Developer Tools", "sqlmap", "Nikto", "ffuf and dirb"]}, {"n": "Stage 11.3 - Network Tooling", "c": ["Nmap", "Wireshark", "Netcat", "tcpdump"]}, {"n": "Stage 11.4 - Exploitation Frameworks", "c": ["The Metasploit Framework", "Searchsploit and Exploit Databases"]}, {"n": "Stage 11.5 - Reversing and Binary Tooling", "c": ["Ghidra", "GDB and pwndbg", "radare2 and rizin", "x64dbg", "objdump and readelf"]}, {"n": "Stage 11.6 - Password and Hash Tooling", "c": ["Hashcat", "John the Ripper"]}, {"n": "Stage 11.7 - Python for Security", "c": ["The Requests Library", "Scapy", "pwntools"]}, {"n": "Stage 11.8 - Additional Security Tools", "c": ["CyberChef", "theHarvester and OSINT Tools", "Gobuster and Feroxbuster", "Hydra", "Aircrack-ng", "Volatility", "Autopsy", "Frida", "BloodHound", "Impacket", "Sysinternals Suite", "Trivy and Container Scanners", "Nuclei", "Mimikatz", "Responder", "NetExec", "Shodan", "Maltego", "Nessus and OpenVAS", "Splunk and the ELK Stack", "Wazuh", "Velociraptor", "Cuckoo and CAPE Sandbox", "binwalk", "angr"]}]}, {"n": "Part 12 - Capstone Project", "stages": [{"n": "Stage 12.1 - Building a Home Lab", "c": ["Building a Full Home Lab", "Documenting Your Lab", "Building a D <script>
(function(){
  var DATA=JSON.parse(document.getElementById('data').textContent);
  var GT=DATA.subjects.reduce(function(a,s){return a+s.total;},0);
  var COLORS={ml:'#d08700',dlcv:'#2f78d0',nlp:'#8b5cf6',cs:'#0ea5a3',dsa:'#4f46e5',sec:'#e0562f',fullstack:'#2f9e57',devops:'#0891b2',pl:'#d1408a',cda:'#16a34a'};
  var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
          set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
  var done=LS.get('trackit:done',{}); var theme=LS.get('trackit:theme','auto');
  var active=DATA.subjects[0].key, query='', hideDone=false, openSet={};

  var mainEl=document.getElementById('main'), tabsEl=document.getElementById('tabs'),
      qEl=document.getElementById('q'), footEl=document.getElementById('foot');

  /* ---- theme ---- */
  var TICON={auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg> auto',
    light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg> light',
    dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg> dark'};
  function applyTheme(){var r=document.documentElement; if(theme==='auto')r.removeAttribute('data-theme'); else r.setAttribute('data-theme',theme);
    document.getElementById('theme').innerHTML=TICON[theme];}
  document.getElementById('theme').addEventListener('click',function(){theme=theme==='auto'?'light':theme==='light'?'dark':'auto';LS.set('trackit:theme',theme);applyTheme();});
  applyTheme();

  /* ---- tabs ---- */
  DATA.subjects.forEach(function(s){
    var b=document.createElement('button'); b.className='tab'; b.type='button'; b.setAttribute('role','tab'); b.dataset.key=s.key;
    b.style.setProperty('--sc',COLORS[s.key]||'#888');
    b.innerHTML='<span class="dot"></span><span class="lbl"></span> <span class="n"></span>';
    b.querySelector('.lbl').textContent=s.short;
    b.addEventListener('click',function(){setActive(s.key);});
    tabsEl.appendChild(b);
  });
  function esc(t){return String(t).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
  function subj(k){for(var i=0;i<DATA.subjects.length;i++)if(DATA.subjects[i].key===k)return DATA.subjects[i];}
  function cid(k,i){return k+'#'+i;}
  // Cloud Data Analytics is the subject that currently has local study-note files.
  // Every topic in a stage opens the notes for its corresponding module.
  function studyNoteFor(subjectKey,stageName){
    if(subjectKey!=='cda')return '';
    var match=/Stage\s+(\d+)\./i.exec(stageName||'');
    return match ? 'Module'+match[1]+'_Study_Notes_Enhanced.html' : '';
  }

  /* ---- render active subject ---- */
  function render(){
    var s=subj(active), i=0, html='';
    s.parts.forEach(function(p,pi){
      var pn=('0'+(pi+1)).slice(-2), ids=[];
      var stages='';
      p.stages.forEach(function(st){
        var rows='', sids=[];
        var note=studyNoteFor(s.key,st.n);
        st.c.forEach(function(c){
          i++; var id=cid(s.key,i); ids.push(id); sids.push(id);
          rows+='<label class="concept" data-id="'+id+'" data-t="'+esc(c.toLowerCase())+'">'
              + '<input type="checkbox"'+(done[id]?' checked':'')+'>'
              + '<span class="cx">'+i+'</span>'
              + (note ? '<button class="study-link" type="button" data-note="'+note+'" title="Open the corresponding study notes">'+esc(c)+'</button>' : '<span class="ct">'+esc(c)+'</span>')
              + '</label>';
        });
        var sh = st.n ? '<div class="stage-h"><span class="sn">'+esc(st.n)+'</span>'
              + '<span class="sbadge">0 / '+sids.length+'</span>'
              + '<button class="smark" type="button" title="Mark this stage complete" aria-label="Mark this stage complete">'
              + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path class="tick" d="m8.2 12.1 2.5 2.5 4.8-5.1"/></svg></button></div>' : '';
        stages+='<div class="stage" data-sids="'+sids.join(',')+'">'+sh+rows+'</div>';
      });
      var title=esc(p.n.replace(/^part\s+\d+\s*[-\u2014]\s*/i,''));
      var open=openSet[active] && openSet[active][pi];
      html+='<section class="acc'+(open?' open':'')+'" data-pi="'+pi+'" data-ids="'+ids.join(',')+'" style="--sc:'+(COLORS[s.key]||'#888')+'">'
          + '<div class="acc-h" role="button" tabindex="0" aria-expanded="'+(open?'true':'false')+'">'
          + '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'
          + '<span class="pn">'+pn+'</span><span class="pt">'+title+'</span><span class="pbadge">0 / '+ids.length+'</span>'
          + '<button class="pmark" type="button" title="Mark this section complete" aria-label="Mark this section complete">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path class="tick" d="m8.2 12.1 2.5 2.5 4.8-5.1"/></svg></button>'
          + '</div>'
          + '<div class="acc-body"><div class="acc-inner"><div class="acc-pad">'+stages+'</div></div></div></section>';
    });
    html+='<div class="empty rhide" id="nomatch">no concept matches your filter</div>';
    mainEl.innerHTML=html;
    // wire accordion headers
    mainEl.querySelectorAll('.acc').forEach(function(acc){
      var pi=+acc.dataset.pi, h=acc.querySelector('.acc-h');
      function toggle(){ openSet[active]=openSet[active]||{}; openSet[active][pi]=!acc.classList.contains('open');
        acc.classList.toggle('open'); h.setAttribute('aria-expanded',acc.classList.contains('open')); }
      h.addEventListener('click',function(e){ if(e.target.closest('.pmark'))return; toggle(); });
      h.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
      acc.querySelector('.pmark').addEventListener('click',function(e){ e.stopPropagation();
        var ids=acc.dataset.ids?acc.dataset.ids.split(','):[]; var all=ids.length>0 && ids.every(function(id){return done[id];});
        ids.forEach(function(id){ if(all) delete done[id]; else done[id]=1; });
        LS.set('trackit:done',done);
        acc.querySelectorAll('.concept').forEach(function(l){ var d=!!done[l.dataset.id]; l.querySelector('input').checked=d; l.classList.toggle('done',d); });
        updateCounts(); if(hideDone)applyFilter();
      });
    });
    // wire stage mark buttons
    mainEl.querySelectorAll('.stage').forEach(function(stage){
      var sm=stage.querySelector('.smark'); if(!sm)return;
      sm.addEventListener('click',function(e){ e.stopPropagation();
        var sids=stage.dataset.sids?stage.dataset.sids.split(','):[]; var all=sids.length>0 && sids.every(function(id){return done[id];});
        sids.forEach(function(id){ if(all) delete done[id]; else done[id]=1; });
        LS.set('trackit:done',done);
        stage.querySelectorAll('.concept').forEach(function(l){ var d=!!done[l.dataset.id]; l.querySelector('input').checked=d; l.classList.toggle('done',d); });
        updateCounts(); if(hideDone)applyFilter();
      });
    });
    // wire checkboxes
    mainEl.querySelectorAll('.concept input').forEach(function(cb){
      cb.addEventListener('change',function(){
        var lab=cb.closest('.concept'), id=lab.dataset.id;
        if(cb.checked)done[id]=1; else delete done[id];
        LS.set('trackit:done',done); lab.classList.toggle('done',cb.checked);
        updateCounts(); if(hideDone)applyFilter();
      });
    });
    // A topic title opens its matching notes; the checkbox remains dedicated to progress tracking.
    mainEl.querySelectorAll('.study-link').forEach(function(link){
      function openNotes(){ window.open(encodeURI(link.dataset.note),'_blank','noopener'); }
      link.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); openNotes(); });
      link.addEventListener('keydown',function(e){
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); openNotes(); }
      });
    });
    mainEl.querySelectorAll('.concept').forEach(function(l){ if(done[l.dataset.id])l.classList.add('done'); });
    updateCounts(); applyFilter();
  }

  function updateCounts(){
    var s=subj(active), total=s.total, comp=0;
    mainEl.querySelectorAll('.acc').forEach(function(acc){
      var ids=acc.dataset.ids?acc.dataset.ids.split(','):[], d=0;
      ids.forEach(function(id){if(done[id])d++;});
      comp+=d;
      var full=(d===ids.length && ids.length>0);
      var b=acc.querySelector('.pbadge'); b.textContent=d+' / '+ids.length; b.classList.toggle('full', full);
      var pm=acc.querySelector('.pmark');
      if(pm){ pm.classList.toggle('full', full); pm.classList.toggle('partial', d>0 && !full);
        pm.title=full?'Clear this section':'Mark this section complete'; }
    });
    // per-stage badges + mark state
    mainEl.querySelectorAll('.stage').forEach(function(stage){
      var sids=stage.dataset.sids?stage.dataset.sids.split(','):[], sd=0;
      sids.forEach(function(id){if(done[id])sd++;});
      var sfull=(sd===sids.length && sids.length>0);
      var sb=stage.querySelector('.sbadge'); if(sb){ sb.textContent=sd+' / '+sids.length; sb.classList.toggle('full', sfull); }
      var sm=stage.querySelector('.smark');
      if(sm){ sm.classList.toggle('full', sfull); sm.classList.toggle('partial', sd>0 && !sfull);
        sm.title=sfull?'Clear this stage':'Mark this stage complete'; }
    });
    // done per subject (single pass) -> tabs + overall
    var grandDone=0, perSub={};
    for(var key in done){ var sk=key.split('#')[0]; perSub[sk]=(perSub[sk]||0)+1; grandDone++; }
    // subject bar (tinted the subject color)
    var pct=total?Math.round(comp/total*100):0, sc=COLORS[active]||'var(--accent)';
    var sb=document.getElementById('ovbar'); sb.style.width=pct+'%'; sb.style.background=sc;
    document.getElementById('ovpct').textContent=pct+'%';
    document.getElementById('ovpct').style.color=sc;
    document.getElementById('ovdot-subj').style.background=sc;
    document.getElementById('ovname-subj').textContent=s.short;
    document.getElementById('ovlabel').innerHTML='<b>'+comp.toLocaleString()+'</b> / '+total.toLocaleString();
    // overall bar (all subjects)
    var gp=GT?Math.round(grandDone/GT*100):0;
    document.getElementById('ovbar-all').style.width=gp+'%';
    document.getElementById('ovpct-all').textContent=gp+'%';
    document.getElementById('ovlabel-all').innerHTML='<b>'+grandDone.toLocaleString()+'</b> / '+GT.toLocaleString();
    // tab counts
    tabsEl.querySelectorAll('.tab').forEach(function(t){
      var sk=t.dataset.key, ss=subj(sk), c=perSub[sk]||0;
      t.querySelector('.n').textContent=(c>0?c+'/':'')+ss.total.toLocaleString();
    });
    footEl.innerHTML='<span class="k">subject</span> '+esc(s.name)+' &nbsp; <span class="k">parts</span> '+s.parts.length+' &nbsp; <span class="k">concepts</span> '+total.toLocaleString()+' &nbsp; <span class="k">done</span> '+comp.toLocaleString();
  }

  /* ---- search + hide-done filter ---- */
  function applyFilter(){
    var q=query.trim().toLowerCase(), shown=0;
    mainEl.querySelectorAll('.concept').forEach(function(l){
      var hit=(!q||l.dataset.t.indexOf(q)>=0) && (!hideDone||!done[l.dataset.id]);
      l.classList.toggle('rhide',!hit); if(hit)shown++;
      var ct=l.querySelector('.ct');
      ct.innerHTML = q ? hi(ct.textContent,q) : esc(ct.textContent);
    });
    mainEl.querySelectorAll('.acc').forEach(function(acc){
      var any=acc.querySelector('.concept:not(.rhide)');
      acc.classList.toggle('rhide',!any);
      // when filtering, force-open matching parts; restore when cleared
      if(q||hideDone){ acc.classList.toggle('fopen',!!any); }
      else acc.classList.remove('fopen');
      // hide empty stages
      acc.querySelectorAll('.stage').forEach(function(st){
        st.classList.toggle('rhide', !st.querySelector('.concept:not(.rhide)'));
      });
    });
    document.getElementById('nomatch').classList.toggle('rhide',shown>0);
  }
  function hi(t,q){var lo=t.toLowerCase(),o='',i=0,x;while((x=lo.indexOf(q,i))>=0){o+=esc(t.slice(i,x))+'<mark>'+esc(t.slice(x,x+q.length))+'</mark>';i=x+q.length;}return o+esc(t.slice(i));}

  function setActive(k){
    active=k;
    tabsEl.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected',t.dataset.key===k?'true':'false');});
    render();
    var at=tabsEl.querySelector('.tab[aria-selected="true"]'); if(at&&at.scrollIntoView)at.scrollIntoView({block:'nearest',inline:'nearest'});
    window.scrollTo(0,0);
  }

  var t=null;
  qEl.addEventListener('input',function(){query=qEl.value;clearTimeout(t);t=setTimeout(applyFilter,110);});
  document.getElementById('expand').addEventListener('click',function(){
    openSet[active]=openSet[active]||{};
    mainEl.querySelectorAll('.acc').forEach(function(a){openSet[active][+a.dataset.pi]=true;a.classList.add('open');a.querySelector('.acc-h').setAttribute('aria-expanded','true');});
  });
  document.getElementById('collapse').addEventListener('click',function(){
    openSet[active]={};
    mainEl.querySelectorAll('.acc').forEach(function(a){a.classList.remove('open');a.querySelector('.acc-h').setAttribute('aria-expanded','false');});
  });
  document.getElementById('hidedone').addEventListener('click',function(){
    hideDone=!hideDone; this.style.color=hideDone?'var(--accent)':''; this.style.borderColor=hideDone?'var(--accent)':'';
    this.textContent=hideDone?'show done':'hide done'; applyFilter();
  });

  setActive(active);
})();
</script>
</body>
</html>
